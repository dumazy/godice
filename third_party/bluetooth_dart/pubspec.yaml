name: bluetooth_dart
description: >-
  Cross-platform Bluetooth Low Energy for Dart and Flutter. Pure Dart (no Flutter
  dependency) with native BLE from Rust (btleplug) via FFI and a pluggable
  backend registry.
version: 0.0.1
# Vendored copy; never publish from this repository.
publish_to: none
repository: https://github.com/ManyMath/bluetooth
homepage: https://github.com/ManyMath/bluetooth
issue_tracker: https://github.com/ManyMath/bluetooth/issues
topics:
  - bluetooth
  - ble
  - btleplug
  - ffi

environment:
  sdk: ^3.10.0

resolution: workspace

dependencies:
  ffi: ^2.1.0
  web: ^1.1.0

dev_dependencies:
  lints: ^6.0.0
  test: ^1.25.0
