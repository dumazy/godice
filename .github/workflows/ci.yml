name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Analyze, format, test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Read Flutter version from .fvmrc
        id: fvm
        run: echo "version=$(jq -r .flutter .fvmrc)" >> "$GITHUB_OUTPUT"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.fvm.outputs.version }}
          channel: stable
          cache: true

      - name: Install Melos
        run: dart pub global activate melos

      - name: Bootstrap workspace
        run: melos bootstrap

      - name: Analyze
        run: melos run analyze

      - name: Check formatting
        run: melos run format

      - name: Test
        run: melos run test

      - name: Publish dry-run
        run: melos run publish:dry-run

  min-sdk:
    name: Minimum SDK
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # The floor declared in the pubspecs: `flutter: ">=X.Y.Z"`.
      - name: Read minimum Flutter version
        id: min
        run: |
          v="$(grep -E '^\s*flutter: *"?>=' packages/godice_universal_ble/pubspec.yaml | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')"
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "Minimum Flutter: $v"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.min.outputs.version }}
          channel: stable
          cache: true

      - name: Analyze and test on the minimum SDK
        run: tool/check_min_sdk.sh
